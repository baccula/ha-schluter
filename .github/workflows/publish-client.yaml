name: Publish standalone client
on:
  push:
    tags: ['client-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          python-version: 3.14.10
      - name: Test and build the client
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e library aiohttp==3.14.5 pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==7.1.0 aioresponses==0.7.9 build
          .venv/bin/python -m pytest -c library/pyproject.toml library/tests -q --cov=schluter_wifi --cov-fail-under=96
          .venv/bin/python -m build library --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: client-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
